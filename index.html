<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  /* ===== 기본 디자인 규칙: 큰 글씨, 큰 버튼, 의미 있는 색만 ===== */
  :root{
    --fs:20px;                 /* 설정의 글자 크기에 따라 바뀜 */
    --blue:#185FA5; --blue-bg:#E6F1FB; --blue-dk:#0C447C;
    --green:#3B6D11; --green-bg:#EAF3DE; --green-lt:#C0DD97; --green-dk:#27500A;
    --red:#E24B4A; --red-bg:#FCEBEB; --red-bd:#F09595; --red-dk:#791F1F;
    --amber:#BA7517; --amber-bg:#FAEEDA; --amber-lt:#FAC775; --amber-dk:#633806;
    --ink:#2C2C2A; --sub:#5F5E5A; --muted:#888780; --line:#D3D1C7; --soft:#F1EFE8;
  }
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#fff;line-height:1.45;-webkit-text-size-adjust:100%}
  .app{max-width:560px;margin:0 auto;padding:1rem .9rem 6.5rem}
  h1{font-size:1.3rem;margin:.2rem 0 .7rem;display:flex;align-items:center;gap:.4rem}
  h2{font-size:1rem;margin:1rem 0 .5rem}
  .sub{color:var(--sub);font-size:.85rem}
  .small{font-size:.75rem;color:var(--sub)}
  .hidden{display:none!important}
  button{font-family:inherit;font-size:1rem;cursor:pointer;color:inherit}
  .btn{display:block;width:100%;min-height:56px;border-radius:16px;border:2px solid #B4B2A9;background:#fff;font-weight:700;padding:.6rem .5rem;text-align:center}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.outline{border-color:var(--blue);color:var(--blue)}
  .btn.dashed{border:2.5px dashed var(--blue);color:var(--blue)}
  .btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem}
  .grid3 .btn{font-size:.85rem;min-height:52px;padding:.4rem .2rem}
  .card{border:1.5px solid var(--line);border-radius:16px;padding:.7rem .85rem;margin-bottom:.6rem}
  .card b.t{display:block;font-size:.85rem;color:var(--sub);margin-bottom:.1rem}
  .back{border:none;background:none;padding:.2rem .3rem .2rem 0;font-size:1.3rem;font-weight:700;min-height:44px}
  input,textarea,select{font-family:inherit;font-size:1rem;width:100%;border:2px solid #B4B2A9;border-radius:12px;padding:.55rem .7rem;min-height:52px}
  textarea{min-height:90px}
  label.f{display:block;font-weight:700;margin:.7rem 0 .3rem}
  /* 이전 화면 버튼: 화면을 내려도 위쪽에 늘 보임 */
  .topbar{position:sticky;top:0;z-index:5;background:#fff;padding:.5rem 0 .4rem;margin:-1rem 0 .2rem}
  .backbig{display:inline-flex;align-items:center;gap:.35rem;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:1.05rem;min-height:54px;padding:.3rem 1rem .3rem .7rem}
  .backbig span{font-size:1.5rem;line-height:1}
  ol.steps{margin:.3rem 0 .5rem;padding-left:1.3rem}
  ol.steps li{margin-bottom:.2rem}

  /* 홈 */
  .rec-btn{width:100%;border:none;border-radius:22px;background:var(--red);color:#fff;font-size:1.45rem;font-weight:700;padding:1.1rem .5rem;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.7rem}
  .faces{display:flex;justify-content:space-between;gap:.2rem}
  .face{border:none;background:none;padding:0;text-align:center;font-size:min(.65rem,3.3vw);color:var(--sub);flex:1;min-width:0;white-space:nowrap}
  .face .c{width:min(2.6rem,13vw);height:min(2.6rem,13vw);border-radius:50%;border:2.5px solid;margin:0 auto .15rem;display:flex;align-items:center;justify-content:center;background:#fff}
  .face.on .c{color:#fff!important}
  .progress{height:14px;background:#fff;border-radius:7px;margin:.4rem 0 .3rem;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--green);border-radius:7px}
  .visit{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-dk);border-radius:18px;padding:.7rem .8rem;display:flex;align-items:center;gap:.7rem;width:100%;text-align:left}
  .dday{background:var(--blue);color:#fff;border-radius:12px;padding:.4rem .55rem;font-weight:700;white-space:nowrap}
  .rec-big{font-size:min(1.75rem,8.5vw);padding:1.7rem .5rem;border-radius:26px;margin-bottom:.8rem;white-space:nowrap}
  .rec-big svg{width:min(3.2rem,13vw)!important;height:min(3.2rem,13vw)!important;flex:none}
  .hcard .hb .dday{display:inline-block;padding:.1rem .5rem;font-size:1.15rem;line-height:1.3}
  .half{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .recpanel .timer{font-size:2.6rem;margin:.1rem 0 .9rem}
  .live{background:var(--soft);border-radius:12px;padding:.6rem .7rem;margin:-.6rem 0 .9rem;min-height:4.5rem;max-height:9rem;overflow:auto;font-size:.95rem;line-height:1.5}
  .recpanel{border:3px solid var(--red);border-radius:22px;padding:.9rem;margin-bottom:.8rem;background:#fff}
  .aitag{position:absolute;top:-.55rem;right:.4rem;background:var(--amber);color:#fff;font-size:.6rem;border-radius:6px;padding:0 .35rem}
  .hcard{border:2px solid;border-radius:18px;padding:.7rem .75rem;text-align:left;display:flex;flex-direction:column;min-height:9rem;min-width:0}
  .hcard .ht{font-size:.8rem;font-weight:700}
  .hcard .hb{font-size:1.4rem;margin:.2rem 0;white-space:nowrap}
  .hcard .hs{font-size:.75rem;overflow-wrap:anywhere}

  /* 녹음 */
  .consent{background:var(--amber-bg);color:var(--amber-dk);border-radius:16px;padding:.8rem;margin-bottom:1.4rem}
  .timer{text-align:center;font-size:3.4rem;font-weight:700;margin:.2rem 0 1.4rem;font-variant-numeric:tabular-nums}
  .recdot{display:flex;justify-content:center;align-items:center;gap:.4rem;color:#A32D2D;font-weight:700}
  .recdot i{width:16px;height:16px;border-radius:50%;background:var(--red);display:inline-block}
  .big2 .btn{min-height:110px;font-size:1.25rem;border-width:3px}

  /* 칩·선택 */
  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip{border:1.5px solid #B4B2A9;border-radius:10px;background:#fff;padding:.35rem .7rem;font-size:.85rem;min-height:44px}
  .chip.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

  /* 기록 목록 */
  .rec{display:flex;align-items:center;gap:.7rem;border:1.5px solid var(--line);border-radius:16px;padding:.6rem .8rem;margin-bottom:.55rem;width:100%;background:#fff;text-align:left;min-height:84px}
  .rec.new{border:2.5px solid var(--blue);background:var(--blue-bg)}
  .rec .d{width:3rem;text-align:center;border-right:1.5px solid var(--line);padding-right:.5rem;flex:none}
  .rec .d b{display:block;font-size:1.3rem;line-height:1.1}
  .rec .d span{font-size:.7rem;color:var(--sub)}
  .rec .tx{flex:1;min-width:0}
  .rec .tx b{display:block}
  .rec .tx p{margin:0;font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:.6rem;background:var(--blue);color:#fff;border-radius:6px;padding:.05rem .35rem;vertical-align:2px}
  .warn{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-dk)}
  .note{font-size:.7rem;color:var(--muted);text-align:center;margin:.4rem 0}
  .player{background:var(--soft);border-radius:16px;padding:.7rem .8rem;margin-bottom:.6rem}
  .player audio{width:100%;margin-top:.4rem}

  /* 할 일 체크 */
  .ck{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;border:1.5px solid var(--line);border-radius:14px;margin-bottom:.4rem;width:100%;background:#fff;text-align:left;min-height:56px}
  .ck .bx{width:1.7rem;height:1.7rem;border-radius:8px;border:3px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .ck.done{background:var(--green-bg);border-color:#97C459;color:var(--green-dk)}
  .ck.done .bx{background:var(--green);border-color:var(--green)}
  .ck.miss{background:var(--amber-bg);border-color:#EF9F27;color:var(--amber-dk)}
  .ck.miss .bx{background:var(--amber);border-color:var(--amber)}
  .ck .tag{margin-left:auto;font-size:.65rem;background:var(--soft);color:#444441;border-radius:6px;padding:.1rem .4rem;white-space:nowrap}
  .rm{margin-left:.3rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);font-size:.7rem;padding:.3rem .45rem;white-space:nowrap;flex:none;min-height:44px}
  .chip{white-space:nowrap}
  .slot{font-weight:700;color:var(--sub);font-size:.85rem;margin:.6rem 0 .3rem}

  /* 기록(이벤트) */
  .ev{padding:.5rem .75rem;border-radius:14px;margin-bottom:.4rem;border:1.5px solid var(--red-bd);background:var(--red-bg);color:var(--red-dk)}
  .ev.a{border-color:#EF9F27;background:var(--amber-bg);color:var(--amber-dk)}
  .ev small{display:block;font-size:.75rem}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;text-align:center;margin-bottom:.6rem}
  .stat div{border:1.5px solid var(--line);border-radius:12px;padding:.3rem 0}
  .stat b{display:block;font-size:1.2rem}
  .stat span{font-size:.65rem}

  /* 캘린더 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal .h{font-size:.7rem;color:var(--sub)}
  .cal button{border:1.5px solid var(--soft);background:#fff;border-radius:10px;font-weight:700;font-size:.85rem;padding:.25rem 0 0;height:3rem;position:relative}
  .cal button.full{background:var(--green);border-color:var(--green);color:#fff}
  .cal button.half{background:var(--green-lt);border-color:var(--green-lt);color:#173404}
  .cal button.low{background:var(--amber-lt);border-color:var(--amber-lt);color:#412402}
  .cal button.today{border:2.5px solid var(--blue)}
  .cal button.future{color:var(--muted)}
  .cal .dots{position:absolute;left:0;right:0;bottom:4px;line-height:0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1px;box-shadow:0 0 0 1.5px #fff}
  .legend{font-size:.7rem;color:var(--sub);line-height:1.9;margin:.6rem 0}
  .sw{display:inline-block;width:1.1rem;height:.8rem;border-radius:3px;vertical-align:-1px;margin-right:2px}

  /* 설정 */
  .row{display:flex;align-items:center;gap:.6rem;padding:.55rem .2rem;border-bottom:1.5px solid var(--soft);min-height:56px}
  .row .v{margin-left:auto;color:var(--sub);font-size:.85rem;white-space:nowrap}
  .row > div{min-width:0;flex:1}
  .row input{min-width:0}
  .gh{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:.7rem}
  .av{width:2.3rem;height:2.3rem;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex:none}
  .tog{width:3.2rem;height:1.8rem;border-radius:1rem;background:#B4B2A9;border:none;position:relative;margin-left:auto;flex:none}
  .tog::after{content:"";position:absolute;left:3px;top:3px;width:calc(1.8rem - 6px);height:calc(1.8rem - 6px);border-radius:50%;background:#fff;transition:left .15s}
  .tog.on{background:var(--green)}
  .tog.on::after{left:calc(100% - 1.8rem + 3px)}
  .seg{display:flex;gap:.3rem;margin-left:auto}
  .seg button{border:1.5px solid #B4B2A9;background:#fff;border-radius:10px;padding:.25rem .5rem;font-size:.75rem;min-height:40px}
  .seg button.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .pf{display:flex;gap:.6rem;padding:.6rem .1rem;border-bottom:1.5px solid var(--soft)}
  .pf b{width:5rem;flex:none;color:var(--sub);font-size:.85rem}

  /* 하단 탭 */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:.35rem 0 calc(.45rem + env(safe-area-inset-bottom));z-index:10}
  nav.tabs button{border:none;background:none;font-size:.75rem;color:var(--muted);padding:.1rem 0;min-height:56px}
  nav.tabs button svg{width:1.5rem;height:1.5rem;display:block;margin:0 auto .1rem}
  nav.tabs button.on{color:var(--blue);font-weight:700}
  svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 로딩·알림 */
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-size:1.1rem;font-weight:700;text-align:center;padding:1rem}
  .spin{width:3rem;height:3rem;border:5px solid var(--blue-bg);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:.6rem 1rem;z-index:60;font-size:.9rem;max-width:90%;text-align:center}
  #doctor{position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:1.2rem;font-size:1.25rem}
  #doctor h1{font-size:1.6rem}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>홈</button>
  <button data-tab="records"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>기록·요약</button>
  <button data-tab="health"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>건강관리</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>설정</button>
</nav>

<div id="loading" class="hidden"><div class="spin"></div><div id="loadingMsg">불러오는 중이에요</div></div>
<div id="toast" class="hidden"></div>
<div id="doctor" class="hidden"></div>
<input type="file" id="fileAny" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm" class="hidden">

<script>
/* ================= 공통 ================= */
const $app = document.getElementById('app');
const S = { settings:{}, view:'home', ev:{}, rec:null, filter:'전체', query:'', month:null, recordsCache:[] };
const FACE_COLORS = ['#3B6D11','#639922','#888780','#BA7517','#A32D2D'];
const FACE_LABELS = ['아주 좋음','좋음','보통','나쁨','아주 나쁨'];
const MOUTHS = ['M8 14c2 3 6 3 8 0','M8.5 14.5c2 1.5 5 1.5 7 0','M8.5 15h7','M8.5 16c2-1.5 5-1.5 7 0','M8 17c2-3 6-3 8 0'];
const KIND_LABEL = {'아픔':'아픔','넘어짐':'넘어짐','약못먹음':'약 못 먹음','어지러움':'어지러움','잠못잠':'잠 못 잠','직접추가':'직접 추가'};
const WEEK = ['월','화','수','목','금','토','일'];

/* 외부(깃허브 페이지 등)에 올려 쓸 때: 앱스 스크립트 웹앱 배포 주소를 넣으세요. */
const API_URL = 'https://script.google.com/macros/s/여기에_배포ID/exec';

/** 서버 함수를 Promise로 부르는 도구
 *  - 앱스 스크립트 안에서 열면 google.script.run 사용
 *  - 외부 주소에서 열면 API_URL로 요청 (마이크 녹음이 되는 방식) */
function run(fn, ...args){
  if (window.google && google.script && google.script.run){
    return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
  }
  let token = '';
  try { token = localStorage.getItem('aihh_token') || ''; } catch(e){}
  if (!token){
    token = (prompt('처음 한 번만 접속 비밀번호를 입력해 주세요') || '').trim();
    try { localStorage.setItem('aihh_token', token); } catch(e){}
  }
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args, token}) })
    .then(r => r.json())
    .then(j => {
      if (!j.ok){
        if (/비밀번호/.test(j.error)) { try { localStorage.removeItem('aihh_token'); } catch(e){} }
        throw new Error(j.error);
      }
      return j.data;
    });
}
/** 로딩 화면을 보여주며 서버를 부릅니다. 오류는 쉬운 말로 알려줍니다. */
async function call(msg, fn, ...args){
  loading(msg);
  try { return await run(fn, ...args); }
  catch(e){ toast(String(e.message || e).replace('Error: ','')); throw e; }
  finally { loading(); }
}
function loading(msg){
  document.getElementById('loading').classList.toggle('hidden', !msg);
  if (msg) document.getElementById('loadingMsg').innerHTML = msg;
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3000);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const p = s.slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function korDate(s, withDay){
  const d = parse(s); const w = ['일','월','화','수','목','금','토'][d.getDay()];
  return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(withDay ? ' ('+w+')' : '');
}
function korTime(hm){
  if (!hm) return '';
  const [h, m] = hm.split(':').map(Number);
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + '시' + (m ? ' ' + m + '분' : '');
}
const IN_GAS = !!(window.google && google.script && google.script.run);
/** 아래 화면(하위 화면) 위쪽: 크게 보이는 '이전 화면' 버튼 + 제목 */
function pageTop(title){
  return `<div class="topbar"><button class="backbig" onclick="back()"><span aria-hidden="true">‹</span>이전 화면</button></div><h1>${title}</h1>`;
}


/** 표정 그림 */
function faceSvg(i, filled){
  const c = filled ? '#fff' : FACE_COLORS[i];
  return `<svg viewBox="0 0 24 24" style="width:78%;height:78%;stroke:${c};stroke-width:1.8"><circle cx="9" cy="10" r=".9" fill="${c}"/><circle cx="15" cy="10" r=".9" fill="${c}"/><path d="${MOUTHS[i]}"/></svg>`;
}
function faces(selected, onclick){
  return `<div class="faces">` + FACE_LABELS.map((l, i) => {
    const on = selected === i + 1;
    return `<button class="face ${on ? 'on' : ''}" onclick="${onclick}(${i+1})"><div class="c" style="border-color:${FACE_COLORS[i]};${on ? 'background:'+FACE_COLORS[i] : ''}">${faceSvg(i, on)}</div>${l}</button>`;
  }).join('') + `</div>`;
}

/** 소리로 읽어주기 (설정의 읽어주기 속도 사용) */
function speak(text){
  if (!('speechSynthesis' in window)) { toast('이 휴대폰에서는 소리로 듣기를 쓸 수 없어요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = S.settings['읽어주기속도'] === '보통' ? 1.0 : 0.8;
  speechSynthesis.speak(u);
}

/** 설정의 글자 크기를 화면 전체에 적용 */
const FONT_SIZES = {'작게':'16px','보통':'19px','크게':'22px','아주 크게':'26px'};
/** 글자 크기를 화면 전체에 바로 적용하고, 이 휴대폰에도 기억해 둡니다(다음에 열 때 바로 적용). */
function applyFont(v){
  const size = FONT_SIZES[v || S.settings['글자크기']] || FONT_SIZES['크게'];
  document.documentElement.style.setProperty('--fs', size);
  document.documentElement.style.fontSize = size;
  try { localStorage.setItem('aihh_font', v || S.settings['글자크기'] || '크게'); } catch(e){}
}
try { const f = localStorage.getItem('aihh_font'); if (f) applyFont(f); } catch(e){}

/* ===== 화면 이동과 '이전 화면' 기록 =====
   홈·기록·건강관리·설정(탭)은 처음 화면, 나머지는 그 위에 쌓이는 화면이에요.
   휴대폰의 뒤로 가기 버튼(제스처)도 같은 방식으로 동작해요. */
const ROOTS = ['home','records','health','settings'];
S.stack = [];
function go(view, ...args){
  if (ROOTS.includes(view)) S.stack = [{view, args}];
  else S.stack.push({view, args});
  pushHist();
  show(view, args);
}
/** 지금 화면을 새 화면으로 바꿔치기(녹음 → 결과처럼 되돌아갈 필요 없는 경우) */
function replaceView(view, ...args){
  S.stack.pop(); S.stack.push({view, args}); show(view, args);
}
function back(){
  if (S.stack.length > 1){ S.stack.pop(); const t = S.stack[S.stack.length - 1]; show(t.view, t.args); }
  else { S.stack = [{view:'home', args:[]}]; show('home', []); }
}
function pushHist(){
  try {
    if (IN_GAS && google.script.history) google.script.history.push({d: S.stack.length});
    else history.pushState({d: S.stack.length}, '');
  } catch(e){}
}
function onHist(state){
  const d = state && state.d;
  if (d && d < S.stack.length){ S.stack = S.stack.slice(0, d); const t = S.stack[d - 1]; show(t.view, t.args); }
  else if (!d && S.stack.length > 1) back();
}
try {
  if (IN_GAS && google.script.history) google.script.history.setChangeHandler(e => onHist(e.state));
  else window.addEventListener('popstate', e => onHist(e.state));
} catch(e){}

function show(view, args){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  S.view = view;
  const tabOf = {help:'settings',home:'home',upload:'home',result:'home',bodylog:'home',visit:'home',records:'records',detail:'records',health:'health',month:'health',day:'health',settings:'settings',profile:'settings'};
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tabOf[view]));
  document.getElementById('tabs').classList.toggle('hidden', view === 'result');
  window.scrollTo(0, 0);
  VIEWS[view](...(args || []));
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

/* ================= 1-2 녹음 (홈 화면 안에서) =================
   - 앱을 외부 주소(깃허브 페이지 등)에 올려 쓰면: 홈에서 바로 녹음하고 멈춤·종료 버튼이 그 자리에 나와요.
   - 앱스 스크립트 주소로 쓰면: 브라우저 마이크가 막혀 있어서 휴대폰 녹음기 앱이 바로 열려요(녹음기에 멈춤·종료가 있어요).
   녹음이 끝나면 '결과 창'이 열립니다. */
const DEPTS = ['내과','정형외과','안과','치과','이비인후과','피부과','신경과','비뇨의학과','산부인과','재활의학과','가정의학과','기타'];

/* [핵심 기능] 녹음 + 실시간 음성인식
   녹음 버튼을 누르면 ① 녹음(다시 듣기용)과 ② 휴대폰 음성인식(받아쓰기)이 동시에 시작돼요.
   받아쓴 글이 화면에 바로바로 보이고, "종료"를 누르면 그 글을 AI가 몇 초 만에 쉬운 말로 요약해요.
   ※ 마이크와 음성인식은 앱을 '깃허브 페이지 주소'로 열었을 때만 동작해요(앱스 스크립트 주소에서는 구글이 막아 둠). */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/** 홈의 녹음 자리: 녹음 전에는 큰 버튼, 녹음 중에는 시간·받아쓰기·멈춤·종료 */
function recSlotHTML(){
  if (S.rec){
    return `<div class="recpanel">
      <div class="recdot" id="recState">${S.rec.paused ? '잠깐 멈췄어요' : '<i></i>녹음하며 받아쓰는 중'}</div>
      <div class="timer" id="timer">${fmtSec(S.rec.sec)}</div>
      <div class="live" id="liveText">${liveHTML()}</div>
      <div class="grid2 big2">
        <button class="btn" id="pauseBtn" onclick="pauseRec()">${S.rec.paused ? '다시 녹음' : '멈춤'}</button>
        <button class="btn dark" onclick="stopRec()">종료</button>
      </div></div>`;
  }
  return `<button class="rec-btn rec-big" onclick="startHomeRec()">
      <svg viewBox="0 0 24 24" style="width:3.2rem;height:3.2rem"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>진료 녹음 시작</button>
    <div class="small" style="text-align:center;margin:-.4rem 0 .7rem">녹음 전에 선생님께 "설명을 녹음해도 될까요?" 하고 여쭤봐 주세요</div>`;
}
function liveHTML(){
  if (!S.rec) return '';
  if (!S.rec.sr) return '<span class="small">이 휴대폰은 실시간 받아쓰기를 지원하지 않아요. 녹음이 끝나면 AI가 녹음을 듣고 정리해요.</span>';
  const t = (S.rec.finalText + ' ' + S.rec.interim).trim();
  return t ? esc(t.slice(-220)) : '<span class="small">선생님 말씀이 여기에 글자로 나와요…</span>';
}
function fmtSec(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function drawRecSlot(){ const el = document.getElementById('recSlot'); if (el) el.innerHTML = recSlotHTML(); }
function drawLive(){ const el = document.getElementById('liveText'); if (el){ el.innerHTML = liveHTML(); el.scrollTop = el.scrollHeight; } }

async function startHomeRec(){
  if (IN_GAS){ showMicHelp(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('이 브라우저는 녹음을 지원하지 않아요. 크롬이나 사파리로 열어 주세요'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('마이크 사용을 "허용"해 주세요. 주소창 옆 자물쇠 → 마이크 → 허용'); return; }
  const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const opts = Object.assign({audioBitsPerSecond: 32000}, mime ? {mimeType: mime} : {});
  const mr = new MediaRecorder(stream, opts);
  S.rec = {chunks:[], sec:0, paused:false, stopping:false, mr, stream, finalText:'', interim:'', sr:null};
  mr.ondataavailable = e => { if (e.data.size) S.rec.chunks.push(e.data); };
  mr.onstop = finishRec;
  mr.start(1000);
  startSR();
  S.rec.timer = setInterval(() => {
    if (S.rec && !S.rec.paused){ S.rec.sec++; const t = document.getElementById('timer'); if (t) t.textContent = fmtSec(S.rec.sec); }
  }, 1000);
  drawRecSlot();
}
/** 휴대폰 음성인식(한국어)을 켭니다. 말이 끊기면 저절로 꺼지므로 녹음 중에는 다시 켜요. */
function startSR(){
  if (!SR) return;
  const r = new SR();
  r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) S.rec.finalText += t.trim() + ' ';
      else interim += t;
    }
    S.rec.interim = interim; drawLive();
  };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ S.rec.srBlocked = true; toast('음성인식이 막혀 있어요. 녹음이 끝나면 AI가 녹음을 듣고 정리할게요'); } };
  r.onend = () => {
    if (S.rec && S.rec.sr === r && !S.rec.paused && !S.rec.stopping && !S.rec.srBlocked){ try { r.start(); } catch(e){} }
  };
  try { r.start(); S.rec.sr = r; } catch(e){ S.rec.sr = null; }
}
function pauseRec(){
  const R = S.rec;
  if (R.mr.state === 'recording'){
    R.mr.pause(); R.paused = true;
    if (R.sr){ R.finalText += R.interim ? R.interim + ' ' : ''; R.interim = ''; try { R.sr.stop(); } catch(e){} }
  } else {
    R.mr.resume(); R.paused = false;
    if (R.sr){ try { R.sr.start(); } catch(e){} }
  }
  drawRecSlot();
}
function stopRec(){
  const R = S.rec; R.stopping = true;
  clearInterval(R.timer);
  if (R.sr){ try { R.sr.stop(); } catch(e){} }
  // 음성인식의 마지막 문장이 들어올 시간을 조금 준 뒤 녹음을 끝내요
  setTimeout(() => { R.mr.stop(); R.stream.getTracks().forEach(t => t.stop()); }, 700);
}
async function finishRec(){
  const R = S.rec;
  const text = (R.finalText + ' ' + R.interim).trim();
  const blob = new Blob(R.chunks, {type: R.mr.mimeType || 'audio/webm'});
  S.rec = null; drawRecSlot();
  if (text.length >= 10){
    // 받아쓴 글로 바로 요약 → 결과 창, 녹음 파일은 뒤에서 조용히 저장
    try {
      const id = await call('AI가 바로 요약하는 중이에요', 'processTranscript', text, '');
      go('result', id);
      uploadAudioLater(id, blob);
    } catch(e){ /* 오류는 call에서 안내 */ }
  } else {
    sendAudio(blob, 'recording.webm');   // 받아쓰기가 안 됐으면 AI가 녹음을 직접 듣고 정리
  }
}
function blobToB64(blob){
  return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
}
async function uploadAudioLater(id, blob){
  if (!blob.size || blob.size > 30 * 1024 * 1024) return;
  try { await run('attachAudio', id, await blobToB64(blob), blob.type || 'audio/webm', 'recording.webm'); toast('녹음 파일도 저장했어요'); }
  catch(e){ toast('녹음 파일은 저장하지 못했어요. 요약은 저장됐어요'); }
}
/** 앱스 스크립트 주소로 열었을 때: 마이크가 막혀 있다는 안내 */
function showMicHelp(){
  document.getElementById('recSlot').innerHTML = `<div class="card" style="border:2.5px solid var(--amber)">
    <b>이 주소에서는 녹음과 받아쓰기를 할 수 없어요</b>
    <div class="small" style="margin:.3rem 0 .6rem">구글 앱스 스크립트 주소는 마이크가 막혀 있어요. 가족에게 "AI건강도우미 깃허브 주소"로 홈 화면 바로가기를 다시 만들어 달라고 해 주세요.</div>
    <button class="btn" onclick="pickAudio()">녹음 파일 고르기</button>
    <button class="btn" style="margin-top:.4rem;min-height:44px;font-size:.8rem" onclick="drawRecSlot()">닫기</button></div>`;
}
function pickAudio(){ document.getElementById('fileAny').click(); }
document.getElementById('fileAny').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  sendAudio(f, f.name || ''); e.target.value = '';
};
/** 녹음을 서버로 보내 AI가 정리하면 결과 창을 엽니다. */
function sendAudio(blob, name){
  if (blob.size > 30 * 1024 * 1024){ toast('녹음 파일이 너무 커요. 드라이브 녹음함에 올려 주세요'); return; }
  const r = new FileReader();
  r.onload = async () => {
    const b64 = String(r.result).split(',')[1];
    try {
      const id = await call('AI가 쉽게 정리하는 중이에요<br><span class="small">1~2분 걸릴 수 있어요</span>', 'processRecording', b64, blob.type || '', '', name || '');
      go('result', id);
    } catch(e){ /* 오류는 call에서 안내 */ }
  };
  r.readAsDataURL(blob);
}

function viewBodylog(){
  S.ev = S.ev && S.ev.keep ? S.ev : {'기분':0,'종류':'','부위':'','양상':'','정도':'','메모':''};
  drawBodylog();
}
function drawBodylog(){
  const e = S.ev, pain = e['종류'] === '아픔', custom = e['종류'] === '직접추가';
  const sel = (k, v) => e[k] === v ? 'sel' : '';
  const opt = (k, list, cls) => list.map(v => `<button class="${cls} ${sel(k, v)}" onclick="setEv('${k}','${v}')">${KIND_LABEL[v] || v}</button>`).join('');
  $app.innerHTML = `
    ${pageTop('몸 상태 기록')}
    <h2>1. 오늘 기분은요?</h2>${faces(e['기분'], 'setMood')}
    <h2>2. 무슨 일이 있었나요?</h2>
    <div class="grid3">${opt('종류', ['아픔','넘어짐','약못먹음','어지러움','잠못잠'], 'btn')}
      <button class="btn dashed ${custom ? 'sel' : ''}" onclick="setEv('종류','직접추가')">+ 직접 추가</button></div>
    <div class="small" style="margin-top:.3rem">목록에 없으면 "+ 직접 추가"를 눌러 적어 주세요</div>
    ${pain ? `
      <h2>3. 어디가 아프세요?</h2><div class="chips">${opt('부위', ['무릎','허리','머리','어깨','배','가슴','손','발','기타'], 'chip')}</div>
      <h2>4. 어떻게 아프세요?</h2><div class="grid3">${opt('양상', ['욱신욱신','콕콕 찌름','뻐근함','저림','화끈거림','붓고 아픔'], 'btn')}</div>
      <h2>5. 얼마나 아프세요?</h2><div class="grid3">${opt('정도', ['조금','많이','아주 많이'], 'btn')}</div>` : ''}
    ${e['종류'] ? `<label class="f" for="memo">${custom ? '어떤 일이 있었나요?' : '더 남길 말 (안 써도 돼요)'}</label>
      <textarea id="memo" placeholder="${custom ? '예: 밥맛이 없어요' : '예: 계단 내려온 뒤'}" oninput="S.ev['메모']=this.value">${esc(e['메모'])}</textarea>` : ''}
    <button class="btn dark" style="margin-top:1rem" onclick="saveEvent()">저장하기</button>`;
}
function setMood(n){ S.ev['기분'] = n; drawBodylog(); }
function setEv(k, v){
  const m = document.getElementById('memo'); if (m) S.ev['메모'] = m.value;
  S.ev[k] = S.ev[k] === v ? '' : v;
  if (k === '종류' && S.ev['종류'] !== '아픔'){ S.ev['부위'] = S.ev['양상'] = S.ev['정도'] = ''; }
  drawBodylog();
}
async function saveEvent(){
  const e = S.ev;
  if (!e['종류'] && !e['기분']){ toast('기분이나 있었던 일을 하나 골라 주세요'); return; }
  if (e['종류'] === '직접추가' && !String(e['메모']).trim()){ toast('어떤 일이 있었는지 적어 주세요'); return; }
  await call('저장하는 중이에요', 'addEvent', e);
  S.ev = {}; toast('기록했어요'); back();
}

function evLine(e){
  const head = (KIND_LABEL[e.kind] || e.kind) + (e.part ? ' · ' + e.part : '');
  const detail = [e.type, e.level].filter(Boolean).join(', ');
  return { head: e.kind === '아픔' && e.part ? e.part + ' 아픔' + (detail ? ' (' + detail + ')' : '') : head, memo: e.memo };
}

async function savePdf(id){
  const p = await call('PDF를 만드는 중이에요', 'makePdf', id);
  const bytes = Uint8Array.from(atob(p.base64), c => c.charCodeAt(0));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'})); a.download = p.name;
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById('pdfLink').innerHTML = `<a class="btn outline" style="text-decoration:none;margin-bottom:.5rem" href="${p.url}" target="_blank">저장한 PDF 열기 (구글 드라이브)</a>`;
  toast('PDF를 저장했어요');
}

/* ================= 3-1 건강관리 ================= */
/** 서버에서 받은 날짜 목록을 항상 날짜순으로 정렬 */
function days(cal){ return (cal.days || []).slice().sort((a, b) => a.date < b.date ? -1 : 1); }
function weekStart(d){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function calCell(dateStr, info, today, onclick){
  const d = parse(dateStr).getDate();
  let cls = '';
  if (info && info.rate != null) cls = info.rate === 100 ? 'full' : info.rate >= 50 ? 'half' : 'low';
  if (dateStr === today) cls += ' today';
  if (dateStr > today) cls += ' future';
  const dots = (info && info.event ? '<span class="dot" style="background:var(--red)"></span>' : '') + (info && info.visit ? '<span class="dot" style="background:var(--blue)"></span>' : '');
  return `<button class="${cls}" onclick="${onclick}('${dateStr}')">${dateStr === today ? '오늘' : d}<span class="dots">${dots}</span></button>`;
}
async function viewHealth(){
  const ws = weekStart(new Date()), we = new Date(ws); we.setDate(ws.getDate() + 6);
  loading('불러오는 중이에요');
  let cal, tasks;
  try { [cal, tasks] = await Promise.all([run('getCalendar', ymd(ws), ymd(we)), run('getTasks', '')]); }
  catch(e){ loading(); toast(String(e.message||e)); return; }
  loading();
  const done = tasks.filter(t => t.done).length;
  const slots = ['아침','낮','저녁','자기전'];
  $app.innerHTML = `

async function viewMonth(){
  if (!S.month){ const n = new Date(); S.month = [n.getFullYear(), n.getMonth()]; }
  const [y, m] = S.month;
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const cal = await call('불러오는 중이에요', 'getCalendar', ymd(first), ymd(last));
  const blanks = (first.getDay() + 6) % 7;
  const c = cal.counts;
  $app.innerHTML = `
    ${pageTop(y + '년 ' + (m+1) + '월')}
    <div class="grid2" style="margin-bottom:.6rem"><button class="btn" onclick="moveMonth(-1)">‹ 지난 달</button><button class="btn" onclick="moveMonth(1)">다음 달 ›</button></div>
    <div class="cal">${WEEK.map(w => `<div class="h">${w}</div>`).join('')}${'<div></div>'.repeat(blanks)}
      ${days(cal).map(x => calCell(x.date, x, cal.today, 'openDay')).join('')}</div>
    <div class="legend">
      <span class="sw" style="background:var(--green)"></span>모두 함 &nbsp;<span class="sw" style="background:var(--green-lt)"></span>절반 이상 &nbsp;<span class="sw" style="background:var(--amber-lt)"></span>절반 미만<br>

    <div class="card" style="background:var(--soft);border:none">

      · 아픔 ${c['아픔']||0}번 · 넘어짐 ${c['넘어짐']||0}번 · 약 못 먹음 ${c['약못먹음']||0}번</div>
    <div class="small" style="color:var(--blue)">날짜를 누르면 그날 기록을 볼 수 있어요</div>`;

function moveMonth(n){ const [y, m] = S.month; const d = new Date(y, m + n, 1); S.month = [d.getFullYear(), d.getMonth()]; viewMonth(); }

  $app.innerHTML = `
    ${pageTop(korDate(date, true))}
    ${d.mood ? `<div class="card" style="display:flex;align-items:center;gap:.7rem">
      <div class="face on" style="flex:none"><div class="c" style="border-color:${FACE_COLORS[d.mood.value-1]};background:${FACE_COLORS[d.mood.value-1]}">${faceSvg(d.mood.value-1, true)}</div></div>
      <div><b>기분: ${FACE_LABELS[d.mood.value-1]}</b><div class="small">${korTime(d.mood.time)}에 기록</div></div></div>` : ''}

    ${d.events.map(e => { const l = evLine(e);
      return `<div class="ev ${e.kind==='약못먹음'?'a':''}"><b>${korTime(e.time)} · ${esc(l.head)}</b>${l.memo ? `<small>${esc(l.memo)}</small>` : ''}</div>`; }).join('') || '<div class="sub">기록이 없어요</div>'}

}

/** 글자 크기: 누르자마자 화면에 적용하고, 저장은 뒤에서 */
async function setFont(v){

  document.querySelectorAll('button[onclick^="setFont"]').forEach(b => b.classList.toggle('sel', b.getAttribute('onclick') === `setFont('${v}')`));
  try { await run('saveSetting', '글자크기', v); toast('글자 크기를 바꿨어요'); } catch(e){ toast('저장하지 못했어요. 다시 눌러 주세요'); }

  const back = 'https://appengine.google.com/_ah/logout?continue=' + (S.appUrl || 'https://script.google.com');
